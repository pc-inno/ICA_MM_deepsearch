[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp_tools"
version = "0.40.1"
description = "MCP Tools Framework with Sandbox Support"
authors = [{name = "moolean"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.23.0",
    "fastapi>=0.104.0",
    "aiofiles>=23.0.0",
    "pyyaml>=6.0.0",
    "psutil>=5.9.0",
    "typing-extensions>=4.0.0",
    "httpx>=0.25.0",
    "pytest>=8.4.2",
    "requests>=2.32.5",
    "ddgs>=9.6.1",
    "aiohttp>=3.13.0",
    "fastmcp>=2.12.4",
    "asyncddgs>=0.1.0a1",
    "sqlalchemy>=2.0.44",
    "sympy>=1.14.0",
    "numpy>=2.2.6",
    "scipy>=1.15.3",
    "mpmath>=1.3.0",
    "statsmodels>=0.14.5",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "shapely>=2.1.2",
    "cvxpy>=1.7.3",
    "cachetools>=6.2.1",
    "trafilatura>=2.0.0",
    "openai>=2.7.1",
    "transformers>=4.57.1",
    "tiktoken>=0.5.0",
    "playwright==1.51.0",
    "chardet>=5.2.0",
    "pillow>=12.0.0",
    "fetch-url-package>=1.1.0",
]

[project.scripts]
mcp-tools-server = "mcp_tools.server:main"

[tool.setuptools]
packages = {find = {where = ["."]}}

[tool.setuptools.package-data]
"mcp_tools.tools.airline.data" = ["*.json"]
